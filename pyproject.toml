[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mca-plataforma"
version = "0.1.0"
description = "Motor de Conformidade Aduaneira — Plataforma unificada de extração hierárquica normativa"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "GPL-3.0"}
authors = [
    {name = "InnovAI Ltda", email = "contato@innovai.com.br"}
]
dependencies = [
    "requests>=2.32.0",
    "pydantic>=2.0.0",
    "neo4j>=5.0.0",
    "pyyaml>=6.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=6.0.0",
    "unidecode>=1.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-mock>=3.10.0",
    "hypothesis>=6.0.0",
    "coverage>=7.0.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
]
ai = [
    "openai>=1.0.0",
    "anthropic>=0.96.0",
    "google-genai>=1.73.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=src --cov-report=term-missing"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.ruff]
line-length = 100
target-version = "py311"